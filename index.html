<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LiveWorld</title>
<meta name="description" content="Tableau de bord personnel d'intelligence géopolitique et économique">
<meta name="theme-color" content="#0b0e12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LiveWorld">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1112 0v5l2 2H4z M10 20a2 2 0 004 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<header class="top">
  <div class="brand"><h1>LiveWorld</h1><span class="live" id="live"><i></i><span id="liveTxt">Aujourd'hui</span></span></div>
  <button class="search-trigger" id="searchBtn" aria-label="Rechercher dans toute la base"><svg width="16" height="16"><use href="#i-search"/></svg><span>Rechercher dans la base…</span><kbd>/</kbd></button>
  <div class="actions">
    <button class="btn pri" id="importBtn">Importer</button>
    <button class="btn" id="exportBtn">Exporter</button>
    <button class="icon" id="bell" aria-label="Journal des imports"><svg width="18" height="18"><use href="#i-bell"/></svg><b id="badge"></b></button>
    <button class="icon" id="settingsBtn" aria-label="Réglages"><svg width="18" height="18"><use href="#i-gear"/></svg></button>
  </div>
</header>

<div class="timebar">
  <div class="datenav" aria-label="Time-Machine">
    <button class="icon sm" id="prevDay" aria-label="Jour précédent">‹</button>
    <input type="date" id="cal" aria-label="Date affichée">
    <button class="icon sm" id="nextDay" aria-label="Jour suivant">›</button>
    <button class="chip" id="todayBtn">Aujourd'hui</button>
  </div>
  <div class="win" id="win" role="group" aria-label="Fenêtre d'activité"></div>
  <div class="themechips" id="themeChips" role="group" aria-label="Filtrer par thème"></div>
</div>
<div class="ticker" id="ticker" aria-label="Marchés"></div>
<div class="ex" id="ex" aria-label="Statut des places boursières"></div>

<div class="main">
  <section class="mapwrap" id="mapwrap" aria-label="Carte du monde">
    <svg id="map" role="img" aria-label="Carte mondiale des événements"></svg>
    <div class="count"><strong id="cnt">0</strong><span id="cntTxt">événements</span></div>
    <div class="zoom"><button id="zin" aria-label="Zoom avant">+</button><button id="zout" aria-label="Zoom arrière">−</button><button id="zreset" aria-label="Recentrer">⟲</button></div>
    <div class="legend"><span><i class="dot" style="background:var(--crit)"></i>Critique</span><span><i class="dot" style="background:var(--high)"></i>Élevé</span><span><i class="dot" style="background:var(--mod)"></i>Modéré</span><span><i class="dash"></i>Causalité</span><span><i class="dot ghost"></i>Hors période</span></div>
    <div class="tip" id="tip"></div>
  </section>
  <aside class="side">
    <div class="tabs" role="tablist">
      <button role="tab" data-t="dossier" aria-selected="true">Dossier</button>
      <button role="tab" data-t="impacts" aria-selected="false">Impacts</button>
      <button role="tab" data-t="bilan" aria-selected="false">Bilan</button>
      <button role="tab" data-t="flux" aria-selected="false">Flux</button>
      <button role="tab" data-t="themes" aria-selected="false">Thèmes</button>
    </div>
    <div class="pane" id="pane"><p class="empty">Chargement…</p></div>
  </aside>
</div>

<dialog id="modal"><div class="mbox"><header><h2 id="mTitle"></h2><button class="icon sm" id="mClose" aria-label="Fermer">✕</button></header><div class="mbody" id="mBody"></div></div></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="vendor/minisearch.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
